# Starts the morning lead scan on the server (lib/morningScan.js) early every weekday, before the working day.
# Needs the CRON_SECRET repository secret (the same value as CRON_SECRET in Render). "Run workflow" tests it.
name: Morning lead scan
on:
  schedule:
    - cron: "30 5 * * 1-5" # 05:30 UTC: 5:30am in winter, 6:30am in summer (UK)
  workflow_dispatch:
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start the scan
        env:
          APP_URL: ${{ vars.APP_URL || 'https://icl-sales.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Add the CRON_SECRET repository secret first (Settings → Secrets and variables → Actions)."; exit 1; fi
          # The app may be asleep: a few tries while it wakes up. The key is URL-encoded, so any characters work.
          for i in 1 2 3 4 5; do
            code=$(curl -sS -G --max-time 120 -o out.json -w "%{http_code}" --data-urlencode "key=$CRON_SECRET" "$APP_URL/api/cron" || echo 000)
            cat out.json 2>/dev/null; echo
            if [ "$code" = "200" ]; then exit 0; fi
            if [ "$code" = "401" ]; then echo "Wrong key: CRON_SECRET here must match CRON_SECRET in Render exactly (and Render must have redeployed since it was added)."; exit 1; fi
            echo "Not awake yet (HTTP $code), trying again in 30 seconds…"; sleep 30
          done
          exit 1
